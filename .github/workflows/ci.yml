name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure controls run stamp
        run: echo "EVAL_CONTROLS_STAMP=${GITHUB_RUN_ID}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - name: Run deterministic evaluation controls (fake provider, no model)
        env:
          AGY_BIN: /usr/bin/false
        run: bash evaluation/run_controls.sh
      - name: Upload controls evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-controls-evidence
          path: evaluation/runs/controls-${{ env.EVAL_CONTROLS_STAMP }}*
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets
